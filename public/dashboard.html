<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GoatBot Desk</title>
<style>
:root{color-scheme:light;--bg:#f3f6f5;--panel:#fff;--side:#172321;--sideText:#b9c9c4;--ink:#17231f;--mute:#6c7d77;--line:#e0e8e4;--accent:#168468;--accentSoft:#e1f3ed;--blue:#356ecb;--blueSoft:#e8effb;--warn:#a86a13;--warnSoft:#fbf0d9;--bad:#b43e35;--badSoft:#f9e6e3;--shadow:0 6px 22px rgba(27,54,45,.045)}
:root[data-theme=dark]{color-scheme:dark;--bg:#121917;--panel:#1b2421;--side:#0b100f;--sideText:#a8b8b2;--ink:#e7efeb;--mute:#91a19a;--line:#2c3934;--accent:#45c59a;--accentSoft:#18392e;--blue:#83aaf2;--blueSoft:#1f2c42;--warn:#e5b24d;--warnSoft:#3b301b;--bad:#ef8074;--badSoft:#402421;--shadow:0 6px 22px rgba(0,0,0,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.48 "Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr)}
aside{position:sticky;top:0;height:100vh;background:var(--side);color:var(--sideText);padding:16px 10px;display:flex;flex-direction:column;gap:3px}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;color:#f5fbf8;font-size:16px;font-weight:650}.mark{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:#65d2a8;color:#10362a;font-weight:800}.nav{width:100%;display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left}.nav:hover{background:#ffffff10}.nav[aria-current=page]{background:#ffffff15;color:#fff}.nav svg{width:18px;height:18px;flex:none}.sideFoot{margin-top:auto;padding:12px 10px;font-size:12px;color:#859991}.sideFoot strong{display:block;color:#a6d9c4;font-weight:500;margin-bottom:3px}
main{min-width:0}.top{height:auto;min-height:60px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line)}.top h1{margin:0;font-size:17px;font-weight:650}.spacer{flex:1}.select,.input{min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}.button{padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.button:hover{border-color:var(--mute)}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.button.danger{color:var(--bad)}.iconButton{width:36px;height:36px;padding:8px;display:grid;place-items:center}.iconButton svg{width:17px;height:17px}.page{max-width:1250px;padding:22px;margin:0 auto}.statusLine{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12px;margin:0 0 15px}.statusDot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:0}.kpi{padding:13px 15px}.kpi small{display:block;color:var(--mute)}.kpi b{display:block;font-size:25px;line-height:1.25;margin:3px 0;font-weight:650}.delta{color:var(--accent);font-size:12px}.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:13px}.cardTitle{min-height:45px;padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:650}.cardBody{padding:15px}.tableWrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{padding:9px 13px;color:var(--mute);font-size:12px;font-weight:550;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:color-mix(in srgb,var(--bg) 68%,transparent)}.person{display:flex;align-items:center;gap:9px;min-width:160px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:white;font-size:12px;font-weight:700;background:var(--accent)}.subtle{display:block;color:var(--mute);font-size:12px}.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;background:var(--accentSoft);color:var(--accent);font-size:12px}.pill.warn{background:var(--warnSoft);color:var(--warn)}.pill.bad{background:var(--badSoft);color:var(--bad)}.pill.neutral{background:var(--bg);color:var(--mute)}
.bars{height:150px;display:flex;align-items:flex-end;gap:5px;padding-top:5px}.bars i{min-width:6px;flex:1;background:var(--accent);border-radius:3px 3px 0 0;opacity:.8}.bars i:nth-child(3n){background:var(--blue)}.axis{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:7px}.feed{list-style:none;padding:0;margin:0}.feed li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.feed li:last-child{border:0}.feed time{color:var(--mute);font-size:11px;white-space:nowrap}.feedText{min-width:0;overflow-wrap:anywhere}.feedText .message{margin-top:3px;color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}.dot{width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--accent)}.dot.promotion{background:var(--blue)}.dot.command{background:var(--warn)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}.toolbar .spacer{min-width:12px}.toggle{position:relative;width:38px;height:22px;border:0;border-radius:14px;padding:0;background:var(--line);vertical-align:middle}.toggle:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:white;transition:transform .15s}.toggle[aria-pressed=true]{background:var(--accent)}.toggle[aria-pressed=true]:after{transform:translateX(16px)}.segmented{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.segmented button{padding:6px 12px;border:0;border-radius:5px;background:none;color:var(--mute)}.segmented button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px #0002}.rankLayout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.8fr);gap:13px}.rankTable td:first-child{width:55px;color:var(--mute)}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;color:var(--mute)}.field input,.field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.colorField{display:flex;align-items:center;gap:8px}.colorField input{width:42px;height:34px;padding:3px}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.empty{padding:26px 15px;text-align:center;color:var(--mute)}.toast{position:fixed;left:50%;bottom:22px;z-index:30;transform:translate(-50%,12px);padding:9px 14px;border-radius:7px;background:var(--side);color:white;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}.toast.show{opacity:1;transform:translate(-50%,0)}.error{padding:12px 14px;margin-bottom:12px;border-radius:7px;background:var(--badSoft);color:var(--bad)}
.login{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:var(--bg)}.login.show{display:grid}.loginBox{width:min(380px,100%);padding:22px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.loginBox h2{margin:0 0 14px;font-size:18px}.loginBox form{display:grid;gap:10px}.loginBox input{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:7px}.brand{padding:0 8px 0 4px;white-space:nowrap}.nav{width:auto;white-space:nowrap}.sideFoot{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.rankLayout{grid-template-columns:1fr}.page{padding:14px}.top{padding:9px 12px;flex-wrap:wrap}.top h1{font-size:16px}}
@media(max-width:540px){.kpis{gap:8px}.kpi{padding:11px}.kpi b{font-size:21px}.top .select{max-width:48vw}.formGrid{grid-template-columns:1fr}.cardBody{padding:12px}.toolbar{padding:9px}.nav{padding:8px}.nav svg{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span class="mark">G</span>GoatBot Desk</div>
  <div id="nav"></div>
  <div class="sideFoot"><strong>LOCAL SQLITE</strong><span id="storageLabel">Connecting to bot data</span></div>
</aside>
<main>
  <header class="top">
    <h1 id="title">Overview</h1><span class="spacer"></span>
    <select class="select" id="groupSelect" aria-label="Select group"></select>
    <button class="button iconButton" id="refresh" aria-label="Refresh data" title="Refresh data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.6-2L20 12M4 12l2.9 5a7 7 0 0 0 11.6-2"/></svg></button>
    <button class="button iconButton" id="theme" aria-label="Toggle color theme" title="Toggle color theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9c0-1-.8-1.6-1.7-1.4A6 6 0 0 1 13.4 4.7C13.6 3.8 13 3 12 3Z"/></svg></button>
  </header>
  <section class="page" id="view"><div class="empty">Connecting to the local bot database…</div></section>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="login" id="login"><div class="loginBox"><h2>Sign in to GoatBot Desk</h2><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Dashboard password" required><button class="button primary">Sign in</button><div id="loginError" class="subtle" role="alert"></div></form></div></div>
<script>
const icons={overview:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',groups:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6M23 11h-6"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',ranks:'<path d="M8 21h8M12 17v4M7 4h10l-1 8a4 4 0 0 1-8 0L7 4ZM7 7H4v2a4 4 0 0 0 4 4M17 7h3v2a4 4 0 0 1-4 4"/>',banking:'<path d="m3 9 9-6 9 6M4 10h16M6 10v9m4-9v9m4-9v9m4-9v9M3 21h18"/>'};
const pages={overview:'Overview',groups:'Groups',activity:'Activity',ranks:'Rank systems',banking:'Banking'};
const state={view:'overview',rankSystem:'main',data:null,messages:[],groupID:'',bankQuery:'',bankUsers:[],bankTotal:0,bankPage:1,bankScope:'all',bankTimer:null,token:sessionStorage.getItem('goatbot-dashboard-token')||''};
const $=selector=>document.querySelector(selector);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const formatNumber=value=>Number(value||0).toLocaleString();
function toast(text){const node=$('#toast');node.textContent=text;node.classList.add('show');clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.remove('show'),2300)}
function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(state.token)headers.Authorization=`Bearer ${state.token}`;return fetch(path,{...options,headers}).then(async response=>{const data=await response.json().catch(()=>({}));if(response.status===401){$('#login').classList.add('show');throw new Error(data.error||'Sign in required.')}if(!response.ok)throw new Error(data.error||'Request failed.');return data})}
async function initialize(){try{const session=await fetch('/api/session').then(response=>response.json());if(session.passwordRequired&&!session.authenticated){$('#login').classList.add('show');return}await loadState()}catch(error){showError(error.message)}}
async function loadBankingUsers(){const params=new URLSearchParams({search:state.bankQuery,page:String(state.bankPage),pageSize:'50',scope:state.bankScope});if(state.bankScope==='group')params.set('threadID',state.groupID);const result=await api(`/api/banking/users?${params}`);state.bankUsers=result.users;state.bankTotal=result.total;state.bankPage=result.page}
async function getBankingRecipientCount(){const params=new URLSearchParams({page:'1',pageSize:'1',scope:state.bankScope});if(state.bankScope==='group')params.set('threadID',state.groupID);return (await api(`/api/banking/users?${params}`)).total}
async function loadState(){try{const suffix=state.groupID?`?threadID=${encodeURIComponent(state.groupID)}`:'';state.data=await api('/api/state'+suffix);state.groupID=state.data.selectedGroupID||state.groupID;if(state.view==='activity'&&state.groupID)state.messages=await api(`/api/messages?threadID=${encodeURIComponent(state.groupID)}`);if(state.view==='banking')await loadBankingUsers();draw()}catch(error){showError(error.message)}}
function showError(message){$('#view').innerHTML=`<div class="error">${escapeHTML(message)}</div><button class="button" id="retry">Retry connection</button>`}
function drawNav(){const nav=$('#nav');nav.innerHTML=Object.entries(pages).map(([key,title])=>`<button class="nav" data-view="${key}" ${state.view===key?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[key]}</svg>${title}</button>`).join('')}
function draw(){if(!state.data)return;drawNav();$('#title').textContent=pages[state.view];$('#storageLabel').textContent=`${state.data.summary.groups} groups · ${state.data.summary.users.toLocaleString()} members`;const select=$('#groupSelect');select.innerHTML=state.data.groups.map(group=>`<option value="${escapeHTML(group.threadID)}">${escapeHTML(group.name)}</option>`).join('')||'<option value="">No groups found</option>';select.value=state.groupID;$('#view').innerHTML=({overview:overviewView,groups:groupsView,activity:activityView,ranks:ranksView,banking:bankingView})[state.view]()}
function overviewView(){const data=state.data;const top=data.groups.slice(0,12);const max=Math.max(1,...top.map(group=>group.messages7d));const bars=top.map(group=>`<i title="${escapeHTML(group.name)} · ${formatNumber(group.messages7d)} messages" style="height:${Math.max(3,group.messages7d/max*100)}%"></i>`).join('');const commands=data.commands.slice(0,6);return `<div class="statusLine"><span class="statusDot"></span>Connected to local SQLite data</div><div class="kpis"><div class="card kpi"><small>Groups</small><b>${formatNumber(data.summary.groups)}</b><span class="delta">${data.groups.filter(group=>!group.paused).length} active</span></div><div class="card kpi"><small>Members tracked</small><b>${formatNumber(data.summary.users)}</b><span class="subtle">Local user records</span></div><div class="card kpi"><small>Messages received · 7 days</small><b>${formatNumber(data.summary.messages7d)}</b><span class="subtle">${formatNumber(data.summary.messages24h)} in the last 24 hours</span></div><div class="card kpi"><small>Command calls</small><b>${formatNumber(data.summary.commandCalls)}</b><span class="subtle">Most used: ${escapeHTML(commands[0]?.name||'No command data')}</span></div></div><div class="grid2"><article class="card"><div class="cardTitle">Group messages · 7 days</div><div class="cardBody"><div class="bars">${bars||'<span class="subtle">No activity logged yet</span>'}</div><div class="axis"><span>Groups ordered by activity</span><span>${formatNumber(data.summary.messages7d)} total</span></div></div></article><article class="card"><div class="cardTitle">Most used commands</div><div class="tableWrap"><table><thead><tr><th>Command</th><th>Calls</th></tr></thead><tbody>${commands.map(item=>`<tr><td>/${escapeHTML(item.name)}</td><td>${formatNumber(item.count)}</td></tr>`).join('')||'<tr><td colspan="2" class="subtle">Command usage appears as group messages arrive.</td></tr>'}</tbody></table></div></article></div><article class="card" style="margin-top:13px"><div class="cardTitle">Recent group activity</div>${feed(data.activity.slice(0,8))}</article>`}
function groupsView(){const groups=state.data.groups;return `<article class="card"><div class="cardTitle">Groups <span class="spacer"></span><span class="pill neutral">${groups.length} total</span></div><div class="tableWrap"><table><thead><tr><th>Group</th><th>Members</th><th>Messages · 7d</th><th>Top command</th><th>Bot responses</th><th></th></tr></thead><tbody>${groups.map(group=>`<tr><td><strong>${escapeHTML(group.name)}</strong><span class="subtle">${escapeHTML(group.threadID)}</span></td><td>${formatNumber(group.members)}</td><td>${formatNumber(group.messages7d)}</td><td>${group.commands[0]?`/${escapeHTML(group.commands[0].name)} · ${formatNumber(group.commands[0].count)}`:'—'}</td><td><button class="toggle" data-pause="${escapeHTML(group.threadID)}" aria-label="${group.paused?'Resume':'Pause'} ${escapeHTML(group.name)}" aria-pressed="${group.paused}"></button><span class="pill ${group.paused?'warn':''}">${group.paused?'Paused':'Running'}</span></td><td><button class="button" data-open-group="${escapeHTML(group.threadID)}">Activity</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No groups have been recorded.</td></tr>'}</tbody></table></div></article>`}
function feed(items){if(!items.length)return '<div class="empty">No group activity has been logged yet.</div>';return `<ul class="feed">${items.map(item=>`<li><span class="dot ${item.kind==='promotion'?'promotion':item.command?'command':''}"></span><div class="feedText"><strong>${escapeHTML(item.userName)}</strong><span class="subtle">${escapeHTML(item.group)} · ${item.command?`/${escapeHTML(item.command)}`:item.kind==='promotion'?'Promotion':'Message'}</span><div class="message">${escapeHTML(item.body)}</div></div><time>${escapeHTML(new Date(item.createdAt).toLocaleString())}</time></li>`).join('')}</ul>`}
function activityView(){const group=state.data.groups.find(item=>item.threadID===state.groupID);const events=state.messages.map(item=>({id:item.id,threadID:String(item.threadID),group:group?.name||String(item.threadID),userName:item.userName,body:item.body,command:item.command,kind:item.kind,createdAt:item.createdAt}));return `<article class="card"><div class="cardTitle">${escapeHTML(group?.name||'Group activity')} <span class="spacer"></span><span class="pill neutral">${events.length} recent</span></div>${feed(events)}</article>`}
function colorValue(value,fallback){const color=Array.isArray(value)?value[0]:value;return /^#[0-9a-f]{6}$/i.test(color||'')?color:fallback}
function ranksView(){const system=state.rankSystem;const main=system==='main';const ranks=main?state.data.ranks.main:state.data.ranks.scx;const config=state.data.rankSettings;const users=main?state.data.users:state.data.users.filter(user=>state.data.groupMemberIDs.includes(user.userID));const selected=state.data.groups.find(group=>group.threadID===state.groupID);const card=main?config.mainCard:config.scxCard;const table=ranks.map(row=>`<tr><td>${row.rank}</td><td><div class="person"><span class="avatar">${escapeHTML((row.name||'?').slice(0,1).toUpperCase())}</span><div>${escapeHTML(row.name)}<span class="subtle">${escapeHTML(row.userID)}</span></div></td><td>${main?`Level ${formatNumber(row.level)}`:escapeHTML(row.stage)}</td><td>${formatNumber(row.exp)} XP</td><td><button class="button" data-promote="${escapeHTML(row.userID)}">Promote</button></td></tr>`).join('');const mainSettings=`<form id="mainSettings"><div class="formGrid"><div class="field"><label for="deltaNext">XP step per level</label><input id="deltaNext" type="number" min="1" max="100000" value="${config.deltaNext}" required></div>${[['main_color','Card background','#17352d'],['sub_color','Panel color','#285346'],['text_color','Text color','#f3f8f5'],['exp_color','XP bar color','#168468'],['expNextLevel_color','Progress color','#58c999']].map(([key,label,fallback])=>`<div class="field"><label>${label}</label><span class="colorField"><input type="color" name="${key}" value="${colorValue(card[key],fallback)}"><span class="subtle">${label}</span></span></div>`).join('')}</div><div class="formActions"><button class="button primary">Save main rank settings</button></div></form>`;const scxSettings=`<form id="scxSettings"><div class="field"><label for="scxPreset">SCX group theme</label><select id="scxPreset">${config.scxPresets.map(preset=>`<option value="${escapeHTML(preset)}" ${preset===selectedScxPreset(card)?'selected':''}>${escapeHTML(preset)}</option>`).join('')}</select></div><div class="formActions"><button class="button primary">Apply SCX theme</button></div></form>`;return `<div class="toolbar"><div class="segmented"><button data-rank-system="main" aria-pressed="${main}">Main rank</button><button data-rank-system="scx" aria-pressed="${!main}">SCX</button></div><span class="subtle">${escapeHTML(selected?.name||'Select a group')}</span></div><div class="rankLayout" style="margin-top:13px"><article class="card"><div class="cardTitle">${main?'Main user ranking':'SCX group ranking'} <span class="spacer"></span><span class="pill neutral">${ranks.length} shown</span></div><div class="tableWrap"><table class="rankTable"><thead><tr><th>#</th><th>Member</th><th>${main?'Level':'Realm'}</th><th>Experience</th><th></th></tr></thead><tbody>${table||'<tr><td colspan="5" class="empty">No ranking data for this group yet.</td></tr>'}</tbody></table></div></article><div><article class="card"><div class="cardTitle">${main?'Main rank design':'SCX theme'}</div><div class="cardBody">${main?mainSettings:scxSettings}</div></article><article class="card" style="margin-top:13px"><div class="cardTitle">Grant a quiet promotion</div><div class="cardBody"><form id="promotionForm"><input type="hidden" id="promotionSystem" value="${system}"><div class="formGrid"><div class="field"><label for="promotionUser">Member</label><select id="promotionUser" required>${users.map(user=>`<option value="${escapeHTML(user.userID)}">${escapeHTML(user.name)} · ${escapeHTML(user.userID)}</option>`).join('')||'<option value="">No current members</option>'}</select></div><div class="field"><label for="promotionXp">XP reward</label><input id="promotionXp" type="number" min="1" max="10000000" value="25" required></div><div class="field" style="grid-column:1/-1"><label for="promotionReason">Reason</label><input id="promotionReason" maxlength="200" placeholder="Optional private note"></div></div><div class="formActions"><button class="button primary" ${users.length?'':'disabled'}>Grant promotion</button></div></form></div></article></div></div>`}
function selectedScxPreset(theme){if(theme?.main_color?.[0]==='#04201a')return'jade';if(theme?.main_color?.[0]==='#f2eee3')return'ink';if(theme?.main_color?.[0]==='#3b0000')return'cinnabar';if(theme?.main_color?.[0]==='#0b0b2e')return'celestial';return'imperial'}
function bankingRows(){return state.bankUsers.map(user=>`<tr><td><div class="person"><span class="avatar">${escapeHTML(user.name.slice(0,1).toUpperCase())}</span><div>${escapeHTML(user.name)}<span class="subtle">${escapeHTML(user.userID)}</span></div></div></td><td>${formatNumber(user.money)}</td><td><input class="input" type="number" min="0" max="9007199254740991" step="1" value="${user.money}" aria-label="New balance for ${escapeHTML(user.name)}" data-balance-for="${escapeHTML(user.userID)}"></td><td><button class="button primary" data-save-balance="${escapeHTML(user.userID)}">Save balance</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No matching users.</td></tr>'}
function bankingView(){const pagesCount=Math.max(1,Math.ceil(state.bankTotal/50));return `<div class="statusLine"><span class="statusDot"></span>Edits the SQLite wallet balance used by /balance</div><article class="card"><div class="toolbar"><select class="select" id="bankScope" aria-label="Reward and search scope"><option value="all" ${state.bankScope==='all'?'selected':''}>All registered users</option><option value="group" ${state.bankScope==='group'?'selected':''}>Selected group members</option></select><input class="input" id="bankSearch" type="search" value="${escapeHTML(state.bankQuery)}" placeholder="Search by name or user ID" aria-label="Search users for balance editing"><span class="spacer"></span><span class="pill neutral">${formatNumber(state.bankTotal)} matches</span></div><div class="subtle" id="bankingSummary" style="padding:10px 13px">Page ${state.bankPage} of ${pagesCount}; search is performed across the full selected scope.</div><div class="tableWrap"><table><thead><tr><th>User</th><th>Current wallet</th><th>Set balance</th><th></th></tr></thead><tbody id="bankRows">${bankingRows()}</tbody></table></div><div class="toolbar"><button class="button" id="bankPrevious" ${state.bankPage<=1?'disabled':''}>Previous</button><button class="button" id="bankNext" ${state.bankPage>=pagesCount?'disabled':''}>Next</button><span class="subtle">Page ${state.bankPage} / ${pagesCount}</span></div></article><article class="card" style="margin-top:14px"><div class="cardTitle">Special money reward</div><div class="cardBody"><form id="bankRewardForm"><div class="formGrid"><div class="field"><label for="rewardAmount">Coins per recipient</label><input id="rewardAmount" type="number" min="1" max="1000000000" step="1" value="100" required></div><div class="field"><label>Recipients</label><span class="subtle">${state.bankScope==='group'?'Current registered members of the selected group':'Every registered user in the database'}</span></div><div class="field" style="grid-column:1/-1"><label for="rewardAnnouncement">Optional announcement</label><textarea class="input" id="rewardAnnouncement" rows="3" maxlength="1000" placeholder="Leave blank to grant silently. Add text to announce the reward in the selected group or all active groups."></textarea></div></div><div class="formActions"><button class="button primary">Grant special reward</button></div></form></div></article>`}
async function perform(path,body){try{await api(path,{method:'POST',body:JSON.stringify(body)});toast('Saved');await loadState()}catch(error){toast(error.message)}}
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.view){state.view=button.dataset.view;if(['activity','banking'].includes(state.view))await loadState();else draw();return}if(button.dataset.rankSystem){state.rankSystem=button.dataset.rankSystem;draw();return}if(button.id==='refresh'){await loadState();toast('Data refreshed');return}if(button.id==='theme'){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('goatbot-theme',root.dataset.theme);return}if(button.id==='retry'){await loadState();return}if(button.dataset.pause){const group=state.data.groups.find(item=>item.threadID===button.dataset.pause);await perform(`/api/groups/${encodeURIComponent(group.threadID)}/pause`,{paused:!group.paused});return}if(button.dataset.openGroup){state.groupID=button.dataset.openGroup;state.view='activity';await loadState();return}if(button.dataset.promote){$('#promotionUser').value=button.dataset.promote;$('#promotionXp').focus();return}if(button.dataset.saveBalance){const user=state.bankUsers.find(item=>item.userID===button.dataset.saveBalance);const input=document.querySelector(`[data-balance-for="${button.dataset.saveBalance}"]`);const money=Number(input?.value);if(!Number.isSafeInteger(money)||money<0){toast('Enter a non-negative whole-number balance');return}if(!window.confirm(`Set ${user.name}'s wallet balance to ${formatNumber(money)}?`))return;await perform('/api/banking/balance',{userID:user.userID,money});return}if(button.id==='bankPrevious'||button.id==='bankNext'){state.bankPage+=button.id==='bankNext'?1:-1;await loadState();return}});
document.addEventListener('change',async event=>{if(event.target.id==='groupSelect'){state.groupID=event.target.value;await loadState()}if(event.target.id==='bankScope'){state.bankScope=event.target.value;state.bankPage=1;await loadState()}});
document.addEventListener('input',event=>{if(event.target.id==='bankSearch'){state.bankQuery=event.target.value;state.bankPage=1;clearTimeout(state.bankTimer);state.bankTimer=setTimeout(()=>loadBankingUsers().then(()=>{if(state.view==='banking')draw()}).catch(error=>toast(error.message)),250)}});
document.addEventListener('submit',async event=>{event.preventDefault();if(event.target.id==='bankRewardForm'){const amount=Number($('#rewardAmount').value);if(!Number.isSafeInteger(amount)||amount<1||amount>1000000000){toast('Enter a whole-number reward from 1 to 1000000000');return}const announcement=$('#rewardAnnouncement').value.trim();const scope=state.bankScope;try{const recipientCount=await getBankingRecipientCount();const label=scope==='group'?'current group members':'registered users';if(!window.confirm(`Add ${formatNumber(amount)} coins to ${formatNumber(recipientCount)} ${label}${announcement?' and send your announcement?':'?'} This cannot be undone.`))return;const result=await api('/api/banking/reward',{method:'POST',body:JSON.stringify({amount,scope,threadID:state.groupID,announcement})});toast(`${formatNumber(result.recipients)} wallets rewarded${announcement?`; sent ${result.announcementSent}, failed ${result.announcementFailed}`:''}`);await loadState()}catch(error){toast(error.message)}return}if(event.target.id==='promotionForm'){const body={threadID:state.groupID,userID:$('#promotionUser').value,system:$('#promotionSystem').value,xp:Number($('#promotionXp').value),reason:$('#promotionReason').value};if(!window.confirm(`Grant ${body.xp} ${body.system.toUpperCase()} XP to this member? No message will be sent.`))return;await perform('/api/ranks/promote',body)}else if(event.target.id==='mainSettings'){const design=Object.fromEntries(new FormData(event.target));await perform('/api/ranks/settings',{threadID:state.groupID,system:'main',deltaNext:Number($('#deltaNext').value),design})}else if(event.target.id==='scxSettings'){await perform('/api/ranks/settings',{threadID:state.groupID,system:'scx',preset:$('#scxPreset').value})}else if(event.target.id==='loginForm'){const error=$('#loginError');error.textContent='';try{const result=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})}).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'Sign in failed.');return data});state.token=result.token;sessionStorage.setItem('goatbot-dashboard-token',state.token);$('#login').classList.remove('show');await loadState()}catch(error){error.textContent=error.message}}});
const savedTheme=localStorage.getItem('goatbot-theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;initialize();setInterval(()=>{if(!document.hidden&&!$('#login').classList.contains('show'))loadState()},30000);
</script>
</body>
</html>
